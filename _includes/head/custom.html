{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon: NMJ monogram (bump ?v= after changing the icon files) -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=2" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=2"/>
<link rel="icon" href="/images/favicon.ico?v=2"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Owner opt-out: open /#notrack once per browser to stop counting your own visits; /#track to resume -->
<script>
(function(){try{var h=location.hash;
 if(h==="#notrack"){localStorage.setItem("skipgc","t");localStorage.setItem("umami.disabled","1");}
 else if(h==="#track"){localStorage.removeItem("skipgc");localStorage.removeItem("umami.disabled");}
}catch(e){}})();
</script>

<!-- GoatCounter visit counter (privacy-friendly, no cookies) -->
<script data-goatcounter="https://neg.goatcounter.com/count" async src="{{ base_path }}/assets/js/goatcounter-count.js"></script>

<!-- Umami visit counter (cookie-free, trial alongside GoatCounter) -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="6d5487a4-9a1d-4007-9f55-91809b7778fd"></script>

<!-- end custom head snippets -->
